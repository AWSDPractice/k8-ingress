apiVersion: apps/v1
kind: Deployment
metadata:
  name: app1
  # labels of deployment resources
  labels:
    app: app1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app1
  template:
    metadata:
      labels:
        app: app1
    spec:
      containers:
      - name: app1
        image: kvineela/app1:1.2.0
        ports:
        - containerPort: 80

---
kind: Service
apiVersion: v1

metadata:
  name: nginx

spec:
  selector: # here ABLES ARE USED AS SELECETORS
    app: app1
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80    

